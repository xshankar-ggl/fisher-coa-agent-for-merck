name: ThermoFisher CoA Agent CI/CD & 5-Axis Evaluation

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  evaluate-and-test:
    name: 5-Axis Rubric Verification & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Static syntax compilation check
        run: |
          python -m py_compile thermofisher_agent/*.py app.py tests/test_thermofisher_agent.py

      - name: Run 5-Axis Evaluation & Unit Test Suite
        run: |
          pytest -v tests/test_thermofisher_agent.py

      - name: Verify CLI Demo Mode Execution
        run: |
          python -m thermofisher_agent.cli --catalog AC29 --no-live-api
          python -m thermofisher_agent.cli --catalog AC29 --lot A0487095 --no-live-api
          python -m thermofisher_agent.cli --demo

  terraform-validate:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest
    needs: evaluate-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init & Validate
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate
