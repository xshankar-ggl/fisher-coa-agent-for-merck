[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermofisher-coa-agent"
version = "1.0.0"
description = "Enterprise AI Chat Agent for ThermoFisher / Fisher Scientific Certificates of Analysis (CoA) Search & Quality Verification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Quality & Analytical Agentic Systems Engineering"}
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
adk = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-secret-manager>=2.20.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
thermofisher-coa-agent = "thermofisher_agent.cli:main"

[tool.setuptools]
packages = ["thermofisher_agent"]
py-modules = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
